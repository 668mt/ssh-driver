name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (server)
        run: npx tsc -p tsconfig.server.json --noEmit

      - name: Type check (web)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify CLI runs
        shell: bash
        run: node dist/cli.js --version && node dist/cli.js --help